name: Feature request
description: Propose a new endpoint, field, or behavior
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? "I'm always frustrated when..." is a good starting sentence.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: willing
    attributes:
      label: Are you willing to implement this?
      options:
        - label: "Yes, I'll open a PR"
        - label: "No, I'm just proposing it"
    validations:
      required: false
